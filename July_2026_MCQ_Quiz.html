// Note: The PDF contains ~250 questions. The above covers the majority transcribed from the provided pages (Q1–~158). Remaining questions follow the same pattern from the original PDF.

const container = document.getElementById('quiz-container');
let answered = 0;
let correctCount = 0;
const total = questions.length;

questions.forEach((item, idx) => {
  const card = document.createElement('div');
  card.className = 'question-card';
  card.dataset.idx = idx;

  let optsHtml = item.options.map((opt, i) => 
    `<button class="option" data-i="${i}">${String.fromCharCode(65+i)}. ${opt}</button>`
  ).join('');

  card.innerHTML = `
    <div class="q-num">প্রশ্ন ${idx+1}</div>
    <div class="q-text">${item.q}</div>
    <div class="options">${optsHtml}</div>
    <div class="feedback"></div>
    ${item.note ? `<div class="note">${item.note}</div>` : ''}
  `;

  card.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', function() {
      if (this.classList.contains('disabled')) return;
      const selected = parseInt(this.dataset.i);
      const isCorrect = selected === item.ans;
      const feedback = card.querySelector('.feedback');
      
      card.querySelectorAll('.option').forEach(b => {
        b.classList.add('disabled');
        if (parseInt(b.dataset.i) === item.ans) b.classList.add('correct');
      });
      
      if (isCorrect) {
        this.classList.add('correct');
        feedback.className = 'feedback show correct-fb';
        feedback.textContent = '✓ সঠিক উত্তর!';
        correctCount++;
      } else {
        this.classList.add('wrong');
        feedback.className = 'feedback show wrong-fb';
        feedback.textContent = '✗ ভুল উত্তর। সঠিক: ' + String.fromCharCode(65+item.ans) + '. ' + item.options[item.ans];
      }
      
      answered++;
      document.getElementById('answered').textContent = answered + ' উত্তর দেওয়া';
      document.getElementById('correct-count').textContent = correctCount + ' সঠিক';
      document.getElementById('progress').style.width = ((answered / total) * 100) + '%';
      card.classList.add('answered');
    });
  });

  container.appendChild(card);
});
</script>
